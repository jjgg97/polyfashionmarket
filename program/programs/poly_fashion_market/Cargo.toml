[package]
name = "poly-fashion-market"
version = "0.1.0"
description = "PolyFashionMarket — decentralized fashion prediction markets on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "poly_fashion_market"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"

[dev-dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
